name: Offline validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Syntax validation
        run: python -m compileall -q app.py evaluation_logic.py release_logic.py workspace_ui.py audit_logic.py audit_ui.py tests
      - name: Offline tests, artifact integrity, and secret-pattern scan
        run: python -m unittest discover -s tests -v
      - name: Whitespace validation
        run: git show --format= --check HEAD
